name: Deploy sauvegardeVPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build React
        run: |
          npm ci
          npm run build

      - name: Prepare server directories
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p /var/www/sauvegarde/public/api
            mkdir -p /var/www/sauvegarde/scripts
            mkdir -p /var/backups/vps-ecobooster
            chmod 700 /var/backups/vps-ecobooster

      - name: Upload frontend files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist/"
          target: "/var/www/sauvegarde/public/"
          strip_components: 1

      - name: Upload API PHP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "public/api/"
          target: "/var/www/sauvegarde/public/api/"
          strip_components: 2

      - name: Upload htaccess
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "public/.htaccess"
          target: "/var/www/sauvegarde/public/"
          strip_components: 1

      - name: Upload scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "scripts/"
          target: "/var/www/sauvegarde/scripts/"
          strip_components: 1
          
      - name: Finalize setup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            chmod +x /var/www/sauvegarde/scripts/backup.sh
            # Installer le cron si pas encore present
            if [ ! -f /etc/cron.d/vps-backup ]; then
              echo "0 2 * * * root /bin/bash /var/www/sauvegarde/scripts/backup.sh >> /var/log/vps-backup-cron.log 2>&1" > /etc/cron.d/vps-backup
              chmod 644 /etc/cron.d/vps-backup
            fi
            systemctl reload apache2 || true
